name: Deploy ke cPanel

run-name: Deploy master oleh @${{ github.actor }}

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # DEPLOY KE SERVER
      # =========================
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 64000

          script: |
            cd /home/kingplat/PembukuanLaser

            git pull origin master

            php artisan optimize:clear
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache


      # =========================
      # NOTIFIKASI BERHASIL
      # =========================
      - name: ✅ Notifikasi Sukses
        if: success()
        run: |
          ACTOR="${{ github.actor }}"

          if [ "$ACTOR" = "agungricky" ]; then
            NAMA="Bang Ricky"
          elif [ "$ACTOR" = "Kaunang" ]; then
            NAMA="Kaunang"
          else
            NAMA="@$ACTOR"
          fi

          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="✅ $NAMA Deploy ke server BERHASIL

          👤 GitHub Actor: @$ACTOR
          🌿 Branch: master
          📦 Project: PembukuanLaser
          📝 Commit: ${{ github.event.head_commit.message }}
          🔖 SHA: ${{ github.sha }}"


      # =========================
      # NOTIFIKASI GAGAL
      # =========================
      - name: ❌ Notifikasi Gagal
        if: failure()
        run: |
          ACTOR="${{ github.actor }}"

          if [ "$ACTOR" = "agungricky" ]; then
            NAMA="Bang Ricky"
          elif [ "$ACTOR" = "Kaunang" ]; then
            NAMA="Kaunang"
          else
            NAMA="@$ACTOR"
          fi

          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="❌ $NAMA Deploy ke server GAGAL!

          👤 GitHub Actor: @$ACTOR
          🌿 Branch: master
          📦 Project: PembukuanLaser
          📝 Commit: ${{ github.event.head_commit.message }}
          🔖 SHA: ${{ github.sha }}

          ⚠️ Cek GitHub Actions untuk melihat error."
